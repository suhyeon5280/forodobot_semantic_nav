# OmniVLA-edge 모델 프로세스 전용 conda 환경.
#
#   conda env create -f environment-policy.yml
#   conda activate rover-policy
#
# torch/torchvision은 일부러 conda 패키지가 아니라 pip으로 받습니다. 최신 GPU에서는
# 이게 중요합니다 — RTX 50 시리즈(Blackwell)는 최신 CUDA 빌드가 필요한데, conda-forge의
# pytorch 빌드는 보통 한 발 늦습니다. 버전도 고정하지 않습니다.
name: rover-policy

channels:
  - conda-forge

dependencies:
  - python=3.10          # 최신 torch 요구사항. 3.10 이상이면 됩니다.
  - pip
  - git                  # policy/requirements.txt의 CLIP이 git+https로 설치됩니다
  - pip:
      - -r policy/requirements.txt
