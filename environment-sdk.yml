# SDK 서버(main.py) 전용 conda 환경.
#
#   conda env create -f environment-sdk.yml
#   conda activate rover-sdk
#
# 모델 환경(environment-policy.yml)과 반드시 분리해서 만드세요. 서버는 pyppeteer를
# 쓰는 Python 3.9 환경이고, 여기에 torch를 섞어봐야 얻는 게 없습니다.
name: rover-sdk

channels:
  - conda-forge

dependencies:
  - python=3.9
  - pip
  # 서버 의존성은 requirements.txt 하나로 유지합니다 (버전 고정본이 거기에 있음).
  - pip:
      - -r requirements.txt
