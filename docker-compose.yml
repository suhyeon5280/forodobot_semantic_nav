version: '3.8'

services:
  app:
    build: .
    environment:
      - DEBUG=true
      - BOT_SLUG=yout-bot-name
      - SDK_API_TOKEN=y0ur4p1tok3n
      # No CHROME_EXECUTABLE_PATH: the image ships Playwright's Chromium.
      - MAP_ZOOM_LEVEL=18
    ports:
      - "8000:8000"
      - "9222:9222"
    volumes:
      - ./screenshots:/app/screenshots
